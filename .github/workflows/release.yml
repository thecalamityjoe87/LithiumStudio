# Release builds for Linux (installer and AppImage), Windows (installer and
# zip) and macOS (installer and dmg).
#
# macOS signing and notarization happen only when these repository secrets
# exist (Settings > Secrets and variables > Actions), as for Lithium Drums;
# without them the app is ad-hoc signed and the .pkg unsigned:
#   MACOS_CERTIFICATES_P12      base64 of a .p12 holding both Developer ID certificates
#   MACOS_CERTIFICATES_PASSWORD its password
#   MACOS_SIGN_APP              "Developer ID Application: Isaac Joseph (TEAMID)"
#   MACOS_SIGN_INSTALLER        "Developer ID Installer: Isaac Joseph (TEAMID)"
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarization
#
# Runs when a version tag is pushed (git tag v0.13.0 && git push origin v0.13.0),
# and then also makes a draft GitHub release with the three files, to check
# and publish by hand. It can also be started from the Actions tab ("Run
# workflow"); the files are then on that run's page, under Artifacts.

name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux installer and AppImage
    runs-on: ubuntu-latest
    # An AppImage only runs on systems with a glibc at least as new as the
    # one it was built with, so it's built on an older Ubuntu (22.04, glibc
    # 2.35): it then runs on most distributions from 2022 on.
    container: ubuntu:22.04
    steps:
      - name: Install build tools and libraries
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends software-properties-common gpg-agent
          # 22.04's own GCC is too old for the C++20 the app uses.
          add-apt-repository -y ppa:ubuntu-toolchain-r/test
          apt-get update
          apt-get install -y --no-install-recommends \
              git ca-certificates curl file python3-pip ninja-build pkg-config g++-13 \
              libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
              libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
              libxrandr-dev libxrender-dev libxi-dev libgl1-mesa-dev libcurl4-openssl-dev libsystemd-dev
          # A current CMake (22.04's is 3.22).
          pip3 install cmake

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # The checkout belongs to the runner's user, not the container's root,
      # and Git won't work in it otherwise (the build applies the patches in
      # external/patches with git apply).
      - name: Let Git use the checkout
        run: git config --global --add safe.directory '*'

      # GCC 13's C++ library is newer than 22.04's, so it's linked into the
      # program instead of being looked for on the user's system.
      - name: Configure
        run: >
          cmake -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13
          -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"

      - name: Build the AppImage
        run: bash packaging/appimage/build-appimage.sh

      # The graphical installer, with the files it installs, in a .tar.gz.
      - name: Build the installer
        run: bash packaging/linux/build-installer.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            build-appimage/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows installer and zip
    runs-on: windows-latest
    steps:
      # The JUCE patches must match its files byte for byte, Windows line
      # endings and all, and some build paths get long.
      - name: Check out files as they are
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # The Visual Studio compiler (and its Ninja) on the PATH, as in a
      # Developer PowerShell.
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # Builds the app, the zip, then the installer from the same files.
      - name: Build the installer and the zip
        run: ./packaging/windows/build-installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            build-zip/*.zip
          if-no-files-found: error

  macos:
    name: macOS installer and dmg
    runs-on: macos-latest
    env:
      # Step conditions can't read secrets directly; these say whether they exist.
      HAS_CERTS: ${{ secrets.MACOS_CERTIFICATES_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Ninja
        run: brew install ninja

      - name: Import signing certificates
        if: env.HAS_CERTS == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
        run: |
          echo "$P12" | base64 --decode > certs.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import certs.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm certs.p12

      - name: Store notarization credentials
        if: env.HAS_NOTARY == 'true'
        run: |
          xcrun notarytool store-credentials lithium --apple-id "${{ secrets.APPLE_ID }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" --password "${{ secrets.APPLE_APP_PASSWORD }}"
          echo "LITHIUM_NOTARY_PROFILE=lithium" >> "$GITHUB_ENV"

      # Builds for Apple Silicon and for Intel, one after the other, and
      # joins them into one app; then packs that app into the installer.
      - name: Build the dmg and the installer
        env:
          LITHIUM_SIGN_APP: ${{ secrets.MACOS_SIGN_APP }}
          LITHIUM_SIGN_INSTALLER: ${{ secrets.MACOS_SIGN_INSTALLER }}
        run: |
          bash packaging/macos/build-dmg.sh
          bash packaging/macos/build-pkg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.pkg
            build-dmg/*.dmg
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create a draft release with the builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --draft --prerelease
          --title "Lithium Studio $GITHUB_REF_NAME"
          --notes "Builds for Linux (installer, or AppImage), Windows (installer, or zip) and macOS (installer, or dmg; Apple Silicon and Intel)."
